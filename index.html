<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="icon" href="https://hzgbai.dpdns.org/icon/mainicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HZGbai 服务导航</title>
    <style>
        :root {
            --bg-base: #0a0f1d;
            --card-bg: rgba(30, 41, 59, 0.45);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --primary: #818cf8;
            --primary-hover: #a78bfa;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
        }

        body { 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            /* 液态弥散背景渐变 */
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(129, 140, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            padding: 2.5rem 1.5rem; 
            line-height: 1.5;
        }

        .container { 
            text-align: center; 
            max-width: 800px; 
            width: 100%; 
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 { 
            font-size: 2.5rem; 
            font-weight: 700; 
            margin-bottom: 0.75rem; 
            background: linear-gradient(135deg, #a5b4fc 0%, #c084fc 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            background-clip: text; 
            letter-spacing: -0.02em;
        }

        .subtitle { 
            font-size: 1.1rem; 
            color: var(--text-sub); 
            margin-bottom: 3rem; 
            font-weight: 400;
        }

        .cards { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 1.75rem; 
            margin-bottom: 2.5rem; 
        }

        /* 液态毛玻璃卡片 */
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--card-border); 
            border-radius: 20px; 
            padding: 2rem; 
            text-align: left; 
            text-decoration: none; 
            color: inherit; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease; 
            box-shadow: var(--card-shadow), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .card:hover { 
            transform: translateY(-4px); 
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
        }

        .card-icon { 
            width: 52px; 
            height: 52px; 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 1.25rem; 
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        .card-mail .card-icon { 
            background: rgba(129, 140, 248, 0.15); 
        }

        .card-captcha .card-icon { 
            background: rgba(167, 139, 250, 0.15); 
        }

        .card-ai .card-icon { 
            background: rgba(236, 72, 153, 0.15); 
        }

        .card h2 { 
            font-size: 1.35rem; 
            font-weight: 600; 
            margin-bottom: 0.5rem; 
            letter-spacing: -0.01em;
        }

        .card-mail h2 { color: #c7d2fe; }
        .card-captcha h2 { color: #ddd6fe; }
        .card-ai h2 { color: #fbcfe8; }

        .card p { 
            font-size: 0.925rem; 
            color: var(--text-sub); 
            line-height: 1.6; 
            flex-grow: 1;
        }

        .card-link { 
            display: flex; 
            align-items: center; 
            gap: 0.4rem; 
            margin-top: 1.5rem; 
            font-size: 0.85rem; 
            font-weight: 500; 
            transition: opacity 0.2s ease;
        }

        .card:hover .card-link {
            opacity: 0.9;
        }

        .card-mail .card-link { color: #a5b4fc; }
        .card-captcha .card-link { color: #c4b5fd; }
        .card-ai .card-link { color: #f472b6; }

        .tbc { 
            color: rgba(148, 163, 184, 0.6); 
            font-size: 0.85rem; 
            margin: 2.5rem 0 1.5rem 0; 
            letter-spacing: 0.15em; 
            text-transform: uppercase;
            font-weight: 500;
        }

        footer { 
            color: rgba(148, 163, 184, 0.6); 
            font-size: 0.85rem; 
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: inline-block;
            width: 100%;
            max-width: 400px;
        }

        footer a { 
            color: var(--primary); 
            text-decoration: none; 
            margin-left: 6px; 
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(129, 140, 248, 0.1);
            border: 1px solid rgba(129, 140, 248, 0.2);
            transition: all 0.25s ease; 
        }

        footer a:hover { 
            color: #ffffff; 
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(129, 140, 248, 0.3);
        }

        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @media (max-width: 640px) {
            body { padding: 2rem 1rem; }
            h1 { font-size: 1.85rem; }
            .subtitle { font-size: 0.95rem; margin-bottom: 2rem; }
            .cards { grid-template-columns: 1fr; gap: 1.25rem; }
            .card { padding: 1.5rem; border-radius: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>欢迎来到 HZGbai 服务导航</h1>
        <p class="subtitle">探索我们的服务，体验极致的简洁与高效</p>

        <div class="cards">
            <a href="https://mail.hzgbai.dpdns.org/" target="_blank" class="card card-mail">
                <div class="card-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                    </svg>
                </div>
                <div>
                    <h2>HZGbai Mail</h2>
                    <p>安全、私密的个人邮件收发平台，保护您的通信隐私</p>
                </div>
                <div class="card-link">
                    <span>mail.hzgbai.dpdns.org</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 17 17 7"></path>
                        <path d="M7 7h10v10"></path>
                    </svg>
                </div>
            </a>

            <a href="https://ai.hzgbai.dpdns.org/" target="_blank" class="card card-ai">
                <div class="card-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1a7 7 0 0 1-7 7h-1v-1.27a2 2 0 1 1-2 0V20h-1a7 7 0 0 1-7-7H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V3.73A2 2 0 0 1 12 2z"></path>
                        <circle cx="9" cy="12" r="1"></circle>
                        <circle cx="15" cy="12" r="1"></circle>
                        <path d="M9 16c.85.63 1.87 1 3 1s2.15-.37 3-1"></path>
                    </svg>
                </div>
                <div>
                    <h2>AI 体验</h2>
                    <p>智能对话与生成式 AI 体验，探索人工智能的无限可能</p>
                </div>
                <div class="card-link">
                    <span>ai.hzgbai.dpdns.org</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 17 17 7"></path>
                        <path d="M7 7h10v10"></path>
                    </svg>
                </div>
            </a>
        </div>

        <p class="tbc">To be continued</p>
        <footer>
            Powered by Cloudflare 
            <a href="https://hzgbai.dpdns.org/cloudmgrgui.html" target="_blank">存储管理器</a>
        </footer>
    </div>
</body>
</html>
