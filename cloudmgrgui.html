<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HZGbai 存储管理器</title>
    <style>
        :root {
            --bg-base: #0a0f1d;
            --card-bg: rgba(30, 41, 59, 0.45);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --danger: #f87171;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --success: #4ade80;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.08);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            outline: none; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            background-color: var(--bg-base);
            /* 液态弥散背景渐变 */
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            padding: 40px 20px; 
            line-height: 1.5;
        }

        .container { 
            width: 100%; 
            max-width: 620px; 
            display: flex; 
            flex-direction: column; 
            gap: 24px; 
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        /* 玻璃卡片 */
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 20px; 
            padding: 28px; 
            border: 1px solid var(--card-border); 
            box-shadow: var(--card-shadow), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease; 
            position: relative; 
            overflow: hidden;
        }

        .card:hover { 
            transform: translateY(-3px); 
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
        }

        h2 { 
            font-size: 1.25rem; 
            font-weight: 600;
            color: var(--text); 
            margin-bottom: 20px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            letter-spacing: -0.01em;
        }

        label { 
            display: block; 
            font-size: 0.85rem; 
            font-weight: 500;
            color: var(--muted); 
            margin-bottom: 8px; 
        }

        /* 输入框样式 */
        input { 
            width: 100%; 
            padding: 12px 16px; 
            background: var(--input-bg); 
            border: 1px solid var(--input-border); 
            border-radius: 12px; 
            color: var(--text); 
            font-size: 0.95rem; 
            transition: all 0.25s ease; 
            margin-bottom: 16px; 
            backdrop-filter: blur(5px);
        }

        input::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        input:focus { 
            border-color: var(--primary); 
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15); 
        }

        /* 主按钮样式 */
        button { 
            width: 100%; 
            padding: 13px 18px; 
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); 
            color: #ffffff; 
            border: none; 
            border-radius: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            font-size: 0.95rem; 
            box-shadow: 0 4px 14px 0 rgba(56, 189, 248, 0.35);
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        button:hover:not(:disabled) { 
            filter: brightness(1.1); 
            transform: translateY(-1px);
            box-shadow: 0 6px 20px 0 rgba(56, 189, 248, 0.45);
        }

        button:active:not(:disabled) { 
            transform: translateY(0); 
            filter: brightness(0.95);
        }

        button:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            filter: grayscale(0.6); 
            box-shadow: none;
        }

        /* 危险类按钮 */
        .btn-danger { 
            background: var(--danger-bg); 
            color: var(--danger); 
            width: auto; 
            padding: 6px 14px; 
            font-size: 0.8rem; 
            border: 1px solid rgba(239, 68, 68, 0.3); 
            box-shadow: none;
            border-radius: 8px;
        }

        .btn-danger:hover { 
            background: var(--danger); 
            color: #ffffff; 
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        /* 关闭按钮 */
        .close-btn { 
            background: transparent; 
            border: none; 
            color: var(--muted); 
            width: 26px; 
            height: 26px; 
            padding: 0; 
            font-size: 1.1rem; 
            line-height: 1;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            flex-shrink: 0; 
            margin-left: 12px;
            box-shadow: none;
        }

        .close-btn:hover { 
            background: rgba(255, 255, 255, 0.1); 
            color: var(--text); 
        }

        /* 状态展开区域 */
        .status-wrapper { 
            max-height: 0; 
            opacity: 0; 
            overflow: hidden; 
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, margin 0.3s ease; 
            margin-top: 0; 
        }

        .status-wrapper.show { 
            max-height: 500px; 
            opacity: 1; 
            margin-top: 16px; 
            overflow: visible; 
        }

        .status { 
            padding: 14px 18px; 
            border-radius: 12px; 
            font-size: 0.875rem; 
            line-height: 1.6; 
            word-break: break-word; 
            animation: fadeIn 0.3s ease; 
            display: flex; 
            align-items: flex-start; 
            justify-content: space-between; 
            backdrop-filter: blur(10px);
        }

        .status-content { 
            flex: 1; 
            margin-right: 8px; 
            min-width: 0; 
        } 

        .status.success { 
            background: rgba(74, 222, 128, 0.12); 
            color: #86efac; 
            border: 1px solid rgba(74, 222, 128, 0.25); 
        }

        .status.error { 
            background: rgba(248, 113, 113, 0.12); 
            color: #fca5a5; 
            border: 1px solid rgba(248, 113, 113, 0.25); 
        }

        .status.loading { 
            background: rgba(56, 189, 248, 0.12); 
            color: #7dd3fc; 
            border: 1px solid rgba(56, 189, 248, 0.25); 
        }

        /* 结果展示卡片 */
        .result-card { 
            margin-top: 20px; 
            padding: 18px; 
            background: rgba(56, 189, 248, 0.06); 
            border: 1px solid rgba(56, 189, 248, 0.2); 
            border-radius: 12px; 
            animation: slideUp 0.3s ease; 
        }

        .result-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
        }

        .result-header strong { 
            color: var(--text); 
            font-size: 1.05rem; 
        }

        .result-card a { 
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 600; 
            display: inline-block; 
            margin-bottom: 10px; 
            transition: color 0.2s;
        }

        .result-card a:hover { 
            color: #7dd3fc;
            text-decoration: underline; 
        }

        .result-link { 
            font-size: 0.8rem; 
            color: var(--muted); 
            word-break: break-all; 
            font-family: 'SFMono-Regular', Consolas, Monaco, monospace; 
            background: rgba(0, 0, 0, 0.3); 
            padding: 10px 12px; 
            border-radius: 8px; 
            display: block; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        /* 表格样式改善 */
        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0; 
            margin-top: 20px; 
            font-size: 0.9rem; 
        }

        th, td { 
            text-align: left; 
            padding: 14px 12px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.06); 
        }

        th { 
            color: var(--muted); 
            font-weight: 600; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
        }

        tr { 
            transition: background 0.2s ease; 
        }

        tr:hover td { 
            background: rgba(255, 255, 255, 0.03); 
        }

        code { 
            background: rgba(0, 0, 0, 0.3); 
            padding: 4px 8px; 
            border-radius: 6px; 
            font-family: 'SFMono-Regular', Consolas, Monaco, monospace; 
            font-size: 0.85rem; 
            color: #7dd3fc;
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }

        .hint { 
            font-size: 0.8rem; 
            color: var(--muted); 
            margin-top: 8px; 
            line-height: 1.5; 
            display: block;
        }

        .secret-row { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-top: 8px; 
            flex-wrap: wrap; 
        }

        .toggle-btn { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            color: var(--muted); 
            padding: 4px 10px; 
            width: auto; 
            font-size: 0.75rem; 
            margin: 0; 
            border-radius: 6px; 
            cursor: pointer; 
            box-shadow: none;
        }

        .toggle-btn:hover { 
            border-color: var(--primary); 
            color: var(--primary); 
            background: rgba(56, 189, 248, 0.1);
        }

        /* 动画与响应式 */
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(24px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }

        @keyframes pulse { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.4; } 
        }

        .loading-text { 
            animation: pulse 1.5s infinite; 
            display: inline-block;
        }

        @media (max-width: 480px) { 
            body { padding: 20px 12px; } 
            .card { padding: 20px 16px; border-radius: 16px; } 
            h2 { font-size: 1.1rem; } 
            input, button { padding: 11px 14px; font-size: 0.9rem; }
            th, td { padding: 10px 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>🔑 JWT 认证</h2>
            <label>API 地址</label>
            <input type="text" id="api_base" value="https://cloud.hzgbai.dpdns.org">
            
            <label>Dashboard JWT_SECRET</label>
            <input type="password" id="gen_secret" placeholder="输入密钥以生成令牌">
            
            <button id="gen_btn" onclick="generateAndValidate()">生成并验证 JWT</button>
            <div class="status-wrapper" id="auth_status_wrap">
                <div id="auth_status"></div>
            </div>
        </div>

        <div class="card" id="download_card" style="display:none;">
            <h2>📥 获取下载链接</h2>
            <input type="text" id="key_id" placeholder="Token ID (如 a3f)">
            <input type="password" id="secret_key" placeholder="Secret Key (64位十六进制)">
            <input type="text" id="fname" placeholder="文件名">
            <button onclick="getFile()">获取链接</button>
            
            <div id="download_result"></div>
            
            <div class="status-wrapper" id="out_wrap"><div id="out"></div></div>
        </div>

        <div class="card" id="token_card" style="display:none;">
            <h2>🛠️ Token 管理</h2>
            <input type="text" id="new_desc" placeholder="新 Token 描述">
            <button onclick="createToken()">创建 Token</button>
            <div class="status-wrapper" id="token_out_wrap"><div id="token_out"></div></div>
            <table>
                <thead><tr><th>ID</th><th>描述</th><th>操作</th></tr></thead>
                <tbody id="token_table"><tr><td colspan="3" style="text-align:center;color:var(--muted);padding:20px;">请先完成认证</td></tr></tbody>
            </table>
        </div>
    </div>

<script>
let sessionJwt = null;
window.addEventListener('beforeunload', () => { sessionJwt = null; });

async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function getApiBase() { return document.getElementById('api_base').value.trim().replace(/\/$/, ''); }

// ✅ 显示状态卡片函数
function showStatus(id, msg, type = 'success') {
    const wrapId = id.replace('_status', '_status_wrap').replace('_out', '_out_wrap');
    const wrap = document.getElementById(wrapId);
    const el = document.getElementById(id);
    if (!wrap || !el) return;
    
    const closeBtn = `<button class="close-btn" onclick="this.closest('.status-wrapper').classList.remove('show')" title="关闭">×</button>`;
    const content = type === 'loading' ? `<span class="loading-text">${msg}</span>` : msg;
    
    el.innerHTML = `<div class="status ${type}"><div class="status-content">${content}</div>${closeBtn}</div>`;
    wrap.classList.add('show');
}

// -------------------------------------------------------------
// 🌟 核心新增：HTTP 状态码与异常智能解析工具
// -------------------------------------------------------------
async function parseResponseError(res, defaultContext = '请求失败') {
    let serverErr = '';
    try {
        const text = await res.text();
        try {
            const j = JSON.parse(text);
            serverErr = j.error || j.message || '';
        } catch {
            serverErr = text;
        }
    } catch {}

    const statusMap = {
        400: '请求参数有误 (400)',
        401: '未经授权或凭证无效 (401)',
        403: '拒绝访问 / 权限不足 (403)',
        404: '请求的接口/资源不存在 (404)',
        500: '服务器内部错误 (500)',
        502: '网关错误 / 上游 Hugging Face 服务异常 (502)',
        504: '网关超时 / 请求上游超时 (504)'
    };

    const statusText = statusMap[res.status] || `HTTP 错误 (${res.status})`;

    if (serverErr) {
        return `❌ ${defaultContext}: <strong>${serverErr}</strong><br><small style="opacity:0.8;">状态提示: ${statusText}</small>`;
    }
    return `❌ ${defaultContext}: <strong>${statusText}</strong>`;
}

function parseFetchError(e, defaultContext = '网络连接异常') {
    if (e.name === 'TypeError' && e.message.includes('fetch')) {
        return `❌ ${defaultContext}: 无法连接到 API 服务器。<br><small style="opacity:0.8;">请检查 API 地址是否填写正确、网络是否通畅或域名 CORS 配置。</small>`;
    }
    return `❌ ${defaultContext}: ${e.message}`;
}
// -------------------------------------------------------------

async function generateAndValidate() {
    const btn = document.getElementById('gen_btn');
    const secret = document.getElementById('gen_secret').value.trim();
    
    if (!secret) { showStatus('auth_status', '⚠️ 请输入 Dashboard JWT_SECRET', 'error'); return; }
    
    btn.disabled = true;
    btn.textContent = '生成中...';
    showStatus('auth_status', '正在生成并验证 JWT...', 'loading');

    try {
        const h = btoa(JSON.stringify({alg:'HS256',typ:'JWT'}));
        const p = btoa(JSON.stringify({sub:'admin',exp:Math.floor(Date.now()/1000)+3600}));
        const sig = await sha256(h + '.' + p + secret);
        const jwt = h + '.' + p + '.' + sig;

        const res = await fetch(`${getApiBase()}/api/tokens/list`, { headers: { 'Authorization': 'Bearer ' + jwt } });
        
        if (res.ok) {
            sessionJwt = jwt;
            showStatus('auth_status', `✅ 认证成功！令牌已保存至内存<br>状态: 有效 (200 OK)`, 'success');
            
            document.getElementById('download_card').style.display = 'block';
            document.getElementById('token_card').style.display = 'block';
            loadTokens();
        } else {
            const errHtml = await parseResponseError(res, '认证失败');
            showStatus('auth_status', `${errHtml}<br><small>提示: 请检查输入的 SECRET 是否与 Worker 配置的 JWT_SECRET 相同。</small>`, 'error');
        }
    } catch (e) {
        showStatus('auth_status', parseFetchError(e, '验证异常'), 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = '生成并验证 JWT';
    }
}

function requireJwt() {
    if (!sessionJwt) throw new Error('请先完成 JWT 认证');
    return sessionJwt;
}

async function getFile() {
    const d = { 
        key_id: document.getElementById('key_id').value.trim(), 
        secret_key: document.getElementById('secret_key').value.trim(), 
        filename: document.getElementById('fname').value.trim() 
    };
    if (!d.key_id || !d.secret_key || !d.filename) { showStatus('out', '⚠️ 请填写 Token ID, Secret Key 和文件名', 'error'); return; }
    
    const resultDiv = document.getElementById('download_result');
    resultDiv.innerHTML = '<div class="status loading" style="margin-top:12px;"><span class="loading-text">正在通信并拉取下载链接...</span></div>';
    
    try {
        const r = await fetch(`${getApiBase()}/api/getfile`, { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(d) 
        });

        if (!r.ok) {
            resultDiv.innerHTML = '';
            const errHtml = await parseResponseError(r, '获取下载链接失败');
            showStatus('out', errHtml, 'error');
            return;
        }
        
        const j = await r.json();
        resultDiv.innerHTML = `
            <div class="result-card">
                <div class="result-header">
                    <strong>📄 ${j.filename}</strong>
                    <button class="close-btn" onclick="this.closest('.result-card').remove()" title="关闭">×</button>
                </div>
                <a href="${j.download_url}" target="_blank" rel="noopener noreferrer">⬇️ 点击打开/下载文件</a>
                <span class="result-link">${j.download_url}</span>
            </div>`;
        showStatus('out', '✅ 成功获取下载地址！', 'success');
    } catch(e) { 
        resultDiv.innerHTML = '';
        showStatus('out', parseFetchError(e, '请求发生错误'), 'error'); 
    }
}

async function loadTokens() {
    try {
        const r = await fetch(`${getApiBase()}/api/tokens/list`, { headers:{'Authorization':'Bearer '+requireJwt()} });
        if (!r.ok) {
            const errHtml = await parseResponseError(r, '加载 Token 列表失败');
            showStatus('token_out', errHtml, 'error');
            return;
        }
        const list = await r.json();
        const tbody = document.getElementById('token_table');
        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:20px;">暂无 Token</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(t => `
            <tr>
                <td><code>${t.key_id}</code></td>
                <td>${t.description}</td>
                <td><button class="btn-danger" onclick="deleteToken('${t.key_id}')">删除</button></td>
            </tr>
        `).join('');
    } catch(e) { showStatus('token_out', parseFetchError(e, '加载列表异常'), 'error'); }
}

async function createToken() {
    const desc = document.getElementById('new_desc').value.trim();
    if (!desc) { showStatus('token_out', '⚠️ 请输入新 Token 的描述信息', 'error'); return; }
    
    showStatus('token_out', '正在向数据库提交创建请求...', 'loading');
    try {
        const r = await fetch(`${getApiBase()}/api/token/add`, { 
            method:'POST', 
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+requireJwt()}, 
            body:JSON.stringify({description:desc}) 
        });

        if (!r.ok) {
            const errHtml = await parseResponseError(r, '创建失败');
            showStatus('token_out', errHtml, 'error');
            return;
        }
        
        const j = await r.json();
        const sid = 'sec_' + Date.now();
        showStatus('token_out', `✅ 创建成功!<br>ID: <code>${j.key_id}</code><div class="secret-row">Secret: <span id="${sid}" style="font-family:monospace;background:rgba(0,0,0,0.3);padding:3px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);">••••••••••••••••</span> <button class="toggle-btn" onclick="toggleSec('${sid}','${j.secret_key}',this)">显示</button></div><span class="hint">⚠️ 请立即保存 Secret，关闭后将无法再次查看！</span>`, 'success');
        document.getElementById('new_desc').value = '';
        loadTokens(); 
    } catch(e) { showStatus('token_out', parseFetchError(e, '创建异常'), 'error'); }
}

function toggleSec(id, val, btn) {
    const el = document.getElementById(id);
    if (btn.textContent === '显示') { el.textContent = val; btn.textContent = '隐藏'; } 
    else { el.textContent = '••••••••••••••••'; btn.textContent = '隐藏'; }
}

async function deleteToken(id) {
    if (!confirm(`确定删除 Token ID "${id}"？此操作不可恢复。`)) return;
    
    showStatus('token_out', `正在删除 Token ${id}...`, 'loading');
    try {
        const r = await fetch(`${getApiBase()}/api/token/delete`, { 
            method:'POST', 
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+requireJwt()}, 
            body:JSON.stringify({key_id:id}) 
        });

        if (!r.ok) {
            const errHtml = await parseResponseError(r, '删除失败');
            showStatus('token_out', errHtml, 'error');
            return;
        }

        showStatus('token_out', `✅ Token <code>${id}</code> 已成功删除`, 'success');
        loadTokens();
    } catch(e) { 
        showStatus('token_out', parseFetchError(e, '删除异常'), 'error');
    }
}
</script>
</body>
</html>
