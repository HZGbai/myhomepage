<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HZGbai 存储管理器</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --primary: #38bdf8; --danger: #ef4444; --success: #4ade80; --border: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        
        .card { background: var(--card); border-radius: 16px; padding: 24px; border: 1px solid var(--border); transition: transform 0.2s ease, box-shadow 0.2s ease; position: relative; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        h2 { font-size: 1.1rem; color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
        input { width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 0.95rem; transition: all 0.2s; margin-bottom: 12px; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1); }
        
        button { width: 100%; padding: 12px; background: var(--primary); color: #0f172a; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        button:hover:not(:disabled) { filter: brightness(1.1); transform: scale(1.02); }
        button:active:not(:disabled) { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: not-allowed; filter: grayscale(0.5); }
        
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); width: auto; padding: 6px 14px; font-size: 0.8rem; border: 1px solid rgba(239, 68, 68, 0.2); }
        .btn-danger:hover { background: var(--danger); color: white; }
        
        /* ✅ 修复：关闭按钮改用 Flex 布局，不再绝对定位 */
        .close-btn { 
            background: transparent; border: none; color: var(--muted); 
            width: 28px; height: 28px; padding: 0; font-size: 1.1rem; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 6px; cursor: pointer; transition: all 0.2s; 
            flex-shrink: 0; margin-left: 12px; align-self: flex-start;
        }
        .close-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }
        
        /* ✅ 修复：状态容器允许内容撑开高度，不再隐藏溢出 */
        .status-wrapper { height: 0; overflow: visible; transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease; opacity: 0; margin-top: 0; }
        .status-wrapper.show { height: auto; opacity: 1; margin-top: 12px; }
        
        /* ✅ 修复：状态框使用 Flex 布局容纳关闭按钮 */
        .status { 
            padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; line-height: 1.5; word-break: break-word; 
            animation: fadeIn 0.3s ease; display: flex; align-items: flex-start; justify-content: space-between; 
        }
        .status > div:first-child { flex: 1; margin-right: 8px; } /* 文字区域自适应 */
        
        .status.success { background: rgba(74, 222, 128, 0.1); color: var(--success); border-left: 3px solid var(--success); }
        .status.error { background: rgba(248, 113, 113, 0.1); color: var(--danger); border-left: 3px solid var(--danger); }
        .status.loading { background: rgba(56, 189, 248, 0.1); color: var(--primary); border-left: 3px solid var(--primary); }
        
        /* 下载结果持久化卡片 */
        .result-card { margin-top: 16px; padding: 16px; background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 10px; animation: slideUp 0.3s ease; position: relative; }
        .result-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .result-card strong { color: var(--text); font-size: 1rem; display: block; }
        .result-card a { color: var(--primary); text-decoration: none; font-weight: 500; display: inline-block; margin-bottom: 8px; }
        .result-card a:hover { text-decoration: underline; }
        .result-link { font-size: 0.75rem; color: var(--muted); word-break: break-all; font-family: monospace; background: var(--bg); padding: 8px; border-radius: 6px; display: block; border: 1px solid var(--border); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.9rem; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); }
        th { color: var(--muted); font-weight: 500; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        tr { transition: background 0.2s; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        
        code { background: var(--bg); padding: 3px 8px; border-radius: 6px; font-family: 'SF Mono', Monaco, monospace; font-size: 0.85rem; border: 1px solid var(--border); }
        .hint { font-size: 0.75rem; color: var(--muted); margin-top: 6px; line-height: 1.4; }
        .secret-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
        .toggle-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; width: auto; font-size: 0.75rem; margin: 0; border-radius: 6px; cursor: pointer; }
        .toggle-btn:hover { border-color: var(--primary); color: var(--primary); }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .loading-text { animation: pulse 1.5s infinite; }
        
        @media (max-width: 480px) { 
            body { padding: 12px; } 
            .card { padding: 18px; border-radius: 12px; } 
            h2 { font-size: 1rem; } 
            input, button { padding: 10px 14px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. 认证模块 -->
        <div class="card">
            <h2>🔑 JWT 认证</h2>
            <label>API 地址</label>
            <input type="text" id="api_base" value="https://cloud.hzgbai.dpdns.org">
            
            <label>Dashboard JWT_SECRET</label>
            <input type="password" id="gen_secret" placeholder="输入密钥以生成令牌">
            
            <button id="gen_btn" onclick="generateAndValidate()">生成并验证 JWT</button>
            <div class="status-wrapper" id="auth_status_wrap">
                <div id="auth_status"></div>
            </div>
        </div>

        <!-- 2. 下载模块 (验证后显示) -->
        <div class="card" id="download_card" style="display:none;">
            <h2>📥 获取下载链接</h2>
            <input type="text" id="key_id" placeholder="Token ID (如 a3f)">
            <input type="password" id="secret_key" placeholder="Secret Key (64位十六进制)">
            <input type="text" id="fname" placeholder="文件名">
            <button onclick="getFile()">获取链接</button>
            
            <div id="download_result"></div>
            
            <div class="status-wrapper" id="out_wrap"><div id="out"></div></div>
        </div>

        <!-- 3. Token管理模块 (验证后显示) -->
        <div class="card" id="token_card" style="display:none;">
            <h2>🛠️ Token 管理</h2>
            <input type="text" id="new_desc" placeholder="新 Token 描述">
            <button onclick="createToken()">创建 Token</button>
            <div class="status-wrapper" id="token_out_wrap"><div id="token_out"></div></div>
            <table>
                <thead><tr><th>ID</th><th>描述</th><th>操作</th></tr></thead>
                <tbody id="token_table"><tr><td colspan="3" style="text-align:center;color:var(--muted);padding:20px;">请先完成认证</td></tr></tbody>
            </table>
        </div>
    </div>

<script>
let sessionJwt = null;
window.addEventListener('beforeunload', () => { sessionJwt = null; });

async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function getApiBase() { return document.getElementById('api_base').value.trim().replace(/\/$/, ''); }

// ✅ 修复：关闭按钮嵌入 Flex 容器，确保不溢出且可点击
function showStatus(id, msg, type = 'success') {
    const wrapId = id.replace('_status', '_status_wrap').replace('_out', '_out_wrap');
    const wrap = document.getElementById(wrapId);
    const el = document.getElementById(id);
    if (!wrap || !el) return;
    
    // 将关闭按钮和内容包裹在 Flex 容器中
    const closeBtn = `<button class="close-btn" onclick="this.parentElement.parentElement.classList.remove('show')" title="关闭">×</button>`;
    const content = type === 'loading' ? `<span class="loading-text">${msg}</span>` : msg;
    
    el.innerHTML = `<div class="status ${type}"><div>${content}</div>${closeBtn}</div>`;
    wrap.classList.add('show');
}

async function generateAndValidate() {
    const btn = document.getElementById('gen_btn');
    const secret = document.getElementById('gen_secret').value.trim();
    
    if (!secret) { showStatus('auth_status', '请输入 Dashboard JWT_SECRET', 'error'); return; }
    
    btn.disabled = true;
    btn.textContent = '生成中...';
    showStatus('auth_status', '正在生成并验证...', 'loading');

    try {
        const h = btoa(JSON.stringify({alg:'HS256',typ:'JWT'}));
        const p = btoa(JSON.stringify({sub:'admin',exp:Math.floor(Date.now()/1000)+3600}));
        const sig = await sha256(h + '.' + p + secret);
        const jwt = h + '.' + p + '.' + sig;

        const res = await fetch(`${getApiBase()}/api/tokens/list`, { headers: { 'Authorization': 'Bearer ' + jwt } });
        
        if (res.ok || res.status === 401) {
            sessionJwt = jwt;
            showStatus('auth_status', `✅ 认证成功！令牌已保存至内存<br>状态: ${res.status === 200 ? '有效' : '格式正确但权限不足'}`, 'success');
            
            document.getElementById('download_card').style.display = 'block';
            document.getElementById('token_card').style.display = 'block';
            loadTokens();
        } else {
            showStatus('auth_status', `❌ 验证失败 (${res.status})<br>请检查 SECRET 是否正确或是否已过期`, 'error');
        }
    } catch (e) {
        showStatus('auth_status', `❌ 网络错误: ${e.message}<br>请检查 API 地址或 CORS 配置`, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = '生成并验证 JWT';
    }
}

function requireJwt() {
    if (!sessionJwt) throw new Error('请先完成 JWT 认证');
    return sessionJwt;
}

async function getFile() {
    const d = { 
        key_id: document.getElementById('key_id').value.trim(), 
        secret_key: document.getElementById('secret_key').value.trim(), 
        filename: document.getElementById('fname').value.trim() 
    };
    if (!d.key_id || !d.secret_key || !d.filename) { showStatus('out', '请填写所有字段', 'error'); return; }
    
    const resultDiv = document.getElementById('download_result');
    resultDiv.innerHTML = '<div class="status loading" style="margin-top:12px;"><span class="loading-text">正在获取链接...</span></div>';
    
    try {
        const r = await fetch(`${getApiBase()}/api/getfile`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d) });
        if (!r.ok) {
            const text = await r.text();
            let errMsg = `服务器错误 (${r.status})`;
            try { errMsg = JSON.parse(text).error || errMsg; } catch {}
            resultDiv.innerHTML = '';
            showStatus('out', errMsg, 'error');
            return;
        }
        
        const j = await r.json();
        // ✅ 下载结果卡片也使用 Flex 头部布局
        resultDiv.innerHTML = `
            <div class="result-card">
                <div class="result-card-header">
                    <strong>${j.filename}</strong>
                    <button class="close-btn" onclick="this.parentElement.parentElement.remove()" title="关闭">×</button>
                </div>
                <a href="${j.download_url}" target="_blank">⬇️ 点击下载文件</a>
                <span class="result-link">${j.download_url}</span>
            </div>`;
    } catch(e) { 
        resultDiv.innerHTML = '';
        showStatus('out', `请求失败: ${e.message}`, 'error'); 
    }
}

async function loadTokens() {
    try {
        const r = await fetch(`${getApiBase()}/api/tokens/list`, { headers:{'Authorization':'Bearer '+requireJwt()} });
        if (!r.ok) {
            const text = await r.text();
            let errMsg = `加载失败 (${r.status})`;
            try { errMsg = JSON.parse(text).error || errMsg; } catch {}
            showStatus('token_out', errMsg, 'error');
            return;
        }
        const list = await r.json();
        const tbody = document.getElementById('token_table');
        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:20px;">暂无 Token</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(t => `
            <tr>
                <td><code>${t.key_id}</code></td>
                <td>${t.description}</td>
                <td><button class="btn-danger" onclick="deleteToken('${t.key_id}')">删除</button></td>
            </tr>
        `).join('');
    } catch(e) { showStatus('token_out', `加载异常: ${e.message}`, 'error'); }
}

async function createToken() {
    const desc = document.getElementById('new_desc').value.trim();
    if (!desc) { showStatus('token_out', '请输入描述', 'error'); return; }
    
    showStatus('token_out', '正在创建...', 'loading');
    try {
        const r = await fetch(`${getApiBase()}/api/token/add`, { 
            method:'POST', 
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+requireJwt()}, 
            body:JSON.stringify({description:desc}) 
        });
        if (!r.ok) {
            const text = await r.text();
            let errMsg = `创建失败 (${r.status})`;
            try { errMsg = JSON.parse(text).error || errMsg; } catch {}
            showStatus('token_out', errMsg, 'error');
            return;
        }
        
        const j = await r.json();
        const sid = 'sec_' + Date.now();
        showStatus('token_out', `✅ 创建成功!<br>ID: <code>${j.key_id}</code><div class="secret-row">Secret: <span id="${sid}" style="font-family:monospace;background:var(--bg);padding:3px 8px;border-radius:6px;border:1px solid var(--border);">••••••••••••••••</span> <button class="toggle-btn" onclick="toggleSec('${sid}','${j.secret_key}',this)">显示</button></div><span class="hint">⚠️ 请立即保存 Secret，关闭后将无法再次查看！</span>`, 'success');
        loadTokens(); 
    } catch(e) { showStatus('token_out', `创建异常: ${e.message}`, 'error'); }
}

function toggleSec(id, val, btn) {
    const el = document.getElementById(id);
    if (btn.textContent === '显示') { el.textContent = val; btn.textContent = '隐藏'; } 
    else { el.textContent = '••••••••••••••••'; btn.textContent = '显示'; }
}

async function deleteToken(id) {
    if (!confirm(`确定删除 "${id}"？此操作不可恢复。`)) return;
    try {
        const r = await fetch(`${getApiBase()}/api/token/delete`, { 
            method:'POST', 
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+requireJwt()}, 
            body:JSON.stringify({key_id:id}) 
        });
        const j = await r.json();
        if (r.ok) loadTokens(); else alert(j.error);
    } catch(e) { alert(e.message); }
}
</script>
</body>
</html>
