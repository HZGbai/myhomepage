<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HZGbai 存储管理器</title>
    <style>
        :root {
            --bg-base: #0a0f1d;
            --card-bg: rgba(30, 41, 59, 0.45);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --danger: #f87171;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --success: #4ade80;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body { 
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            padding: 40px 20px; 
            line-height: 1.5;
        }

        .container { 
            width: 100%; 
            max-width: 620px; 
            display: flex; 
            flex-direction: column; 
            gap: 24px; 
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        /* 优化卡片布局 */
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 20px; 
            padding: 28px; 
            border: 1px solid var(--card-border); 
            box-shadow: var(--card-shadow), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease; 
            position: relative; 
            overflow: hidden; 
            display: block;
        }

        .card:hover { 
            transform: translateY(-3px); 
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card-header h2 { font-size: 1.25rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 10px; letter-spacing: -0.01em; margin-bottom: 0; }

        label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--muted); margin-bottom: 8px; }
        input { 
            width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--input-border); 
            border-radius: 12px; color: var(--text); font-size: 0.95rem; transition: all 0.25s ease; margin-bottom: 16px; backdrop-filter: blur(5px);
        }
        input:focus { border-color: var(--primary); background: rgba(15, 23, 42, 0.8); box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15); }

        .btn-group { display: flex; gap: 12px; }
        button { 
            width: 100%; padding: 13px 18px; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); 
            color: #ffffff; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; 
            transition: all 0.25s ease; font-size: 0.95rem; box-shadow: 0 4px 14px 0 rgba(56, 189, 248, 0.35); display: inline-flex; justify-content: center; align-items: center;
        }
        button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 6px 20px 0 rgba(56, 189, 248, 0.45); }
        button:active:not(:disabled) { transform: translateY(0); filter: brightness(0.95); }
        button:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.6); box-shadow: none; }

        .btn-secondary { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--muted); box-shadow: none; }
        .btn-secondary:hover:not(:disabled) { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.2); }

        .btn-danger { background: var(--danger-bg); color: var(--danger); width: auto; padding: 6px 14px; font-size: 0.8rem; border: 1px solid rgba(239, 68, 68, 0.3); box-shadow: none; border-radius: 8px; }
        .btn-danger:hover { background: var(--danger); color: #ffffff; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }

        .close-btn { background: transparent; border: none; color: var(--muted); width: 26px; height: 26px; padding: 0; font-size: 1.5rem; line-height: 1; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0; box-shadow: none; }
        .close-btn:hover { background: rgba(255, 255, 255, 0.1); color: var(--text); }

        /* 修复状态栏与卡片布局的冲突 */
        .status-wrapper { 
            max-height: 0; 
            opacity: 0; 
            overflow: hidden; 
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease, margin 0.3s ease; 
            margin-top: 0; 
        }
        .status-wrapper.show { 
            max-height: 500px; 
            opacity: 1; 
            margin-top: 16px; 
            overflow: visible; 
        }
        .status { 
            padding: 14px 18px; 
            border-radius: 12px; 
            font-size: 0.875rem; 
            line-height: 1.6; 
            word-break: break-word; 
            animation: fadeIn 0.3s ease; 
            display: flex; 
            align-items: flex-start; 
            justify-content: space-between; 
            backdrop-filter: blur(10px);
        }
        .status-content { flex: 1; margin-right: 8px; min-width: 0; } 
        .status.success { background: rgba(74, 222, 128, 0.12); color: #86efac; border: 1px solid rgba(74, 222, 128, 0.25); }
        .status.error { background: rgba(248, 113, 113, 0.12); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.25); }
        .status.loading { background: rgba(56, 189, 248, 0.12); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.25); }

        /* 后续卡片及表格 */
        .result-card { margin-top: 20px; padding: 18px; background: rgba(56, 189, 248, 0.06); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 12px; animation: slideUp 0.3s ease; }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .result-header strong { color: var(--text); font-size: 1.05rem; }
        .result-card a { color: var(--primary); text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 10px; transition: color 0.2s; }
        .result-card a:hover { color: #7dd3fc; text-decoration: underline; }
        .result-link { font-size: 0.8rem; color: var(--muted); word-break: break-all; font-family: 'SFMono-Regular', Consolas, Monaco, monospace; background: rgba(0, 0, 0, 0.3); padding: 10px 12px; border-radius: 8px; display: block; border: 1px solid rgba(255, 255, 255, 0.05); }

        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 20px; font-size: 0.9rem; }
        th, td { text-align: left; padding: 14px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
        th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.8px; }
        tr { transition: background 0.2s ease; }
        tr:hover td { background: rgba(255, 255, 255, 0.03); }
        code { background: rgba(0, 0, 0, 0.3); padding: 4px 8px; border-radius: 6px; font-family: 'SFMono-Regular', Consolas, Monaco, monospace; font-size: 0.85rem; color: #7dd3fc; border: 1px solid rgba(255, 255, 255, 0.08); }
        .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; line-height: 1.5; display: block; }
        .secret-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
        .toggle-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--muted); padding: 4px 10px; width: auto; font-size: 0.75rem; margin: 0; border-radius: 6px; cursor: pointer; box-shadow: none; }
        .toggle-btn:hover { border-color: var(--primary); color: var(--primary); background: rgba(56, 189, 248, 0.1); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .loading-text { animation: pulse 1.5s infinite; display: inline-block; }

        @media (max-width: 480px) { body { padding: 20px 12px; } .card { padding: 20px 16px; border-radius: 16px; } h2 { font-size: 1.1rem; } input, button { padding: 11px 14px; font-size: 0.9rem; } th, td { padding: 10px 8px; } .btn-group { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录卡片 -->
        <div class="card" id="login_card">
            <div class="card-header">
                <h2>🔑 管理员登录</h2>
            </div>
            <label>API 地址</label>
            <input type="text" id="api_base" value="https://cloud.hzgbai.dpdns.org">
            <label>管理员密码</label>
            <input type="password" id="password_input" placeholder="输入你的明文密码" oninput="checkTrigger(this)">
            <div class="btn-group">
                <button id="login_btn" onclick="adminLogin()">登录</button>
                <button id="logout_btn" class="btn-secondary" style="display:none;" onclick="adminLogout()">🔒 退出登录</button>
            </div>
            <div class="status-wrapper" id="auth_status_wrap">
                <div id="auth_status"></div>
            </div>
        </div>

        <!-- 密码生成卡片 -->
        <div class="card" id="passgen_card" style="display: none;">
            <div class="card-header">
                <h2>🔑 SHA256 密码生成器</h2>
                <button class="close-btn" onclick="closePassgen()">×</button>
            </div>
            <label>输入明文密码 (用于配置环境变量 PASSWORD_HASH)</label>
            <input type="text" id="passgen_input" placeholder="输入明文密码以生成哈希">
            <button onclick="calcPassgen()" style="margin-bottom: 16px;">生成 SHA256</button>
            <label>生成的 SHA256 哈希值 (填入 Cloudflare)</label>
            <input type="text" id="passgen_result" readonly placeholder="生成的哈希将显示在这里" style="background: rgba(0,0,0,0.5);">
        </div>

        <!-- ========================================== -->
        <!-- 数据库重置卡片 (UI 已重构并优化) -->
        <!-- ========================================== -->
        <div class="card" id="db_reset_card" style="display: none;">
            <div class="card-header">
                <h2 style="color: var(--danger); display: flex; align-items: center; gap: 8px;">🔴 数据库重置</h2>
                <button class="close-btn" onclick="closeDbReset()">×</button>
            </div>
            <!-- 警告区域美化 -->
            <div style="background: rgba(220, 38, 38, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 12px; padding: 14px 18px; margin-bottom: 20px; color: #fca5a5; line-height: 1.6; backdrop-filter: blur(5px);">
                <div style="font-weight: 600; margin-bottom: 4px;">⚠️ 高危操作警告</div>
                重置数据库将<strong>永久删除</strong>当前所有 Token 和管理员会话。此操作不可恢复！<br>
                <span style="opacity: 0.7;">仅在初始配置或数据库异常丢失时使用。</span>
            </div>
            
            <label>确认密码 (PASSWORD_HASH)</label>
            <input type="password" id="db_reset_password" placeholder="输入管理员密码以重置数据库">
            
            <button onclick="adminResetDatabase()" style="background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); box-shadow: 0 4px 14px 0 rgba(220, 38, 38, 0.35);">确认重置</button>
            
            <!-- 修复后的状态栏，绝对不会再右边溢出显示怪字 -->
            <div class="status-wrapper" id="db_reset_status_wrap" style="margin-top: 16px;">
                <div id="db_reset_status"></div>
            </div>
        </div>
        <!-- ========================================== -->

        <!-- 下载链接卡片 -->
        <div class="card" id="download_card" style="display:none;">
            <h2>📥 获取下载链接</h2>
            <input type="text" id="token_id" placeholder="Token ID (如 a3f)">
            <input type="password" id="token_secret" placeholder="Token Secret (64位十六进制)">
            <input type="text" id="fname" placeholder="文件名">
            <button onclick="getFile()">获取链接</button>
            <div id="download_result"></div>
            <div class="status-wrapper" id="out_wrap"><div id="out"></div></div>
        </div>

        <!-- Token 管理卡片 -->
        <div class="card" id="token_card" style="display:none;">
            <h2>🛠️ Token 管理</h2>
            <input type="text" id="new_token_id" placeholder="新 Token ID (例如 mykey01)">
            <button onclick="createToken()">创建 Token</button>
            <div class="status-wrapper" id="token_out_wrap"><div id="token_out"></div></div>
            <table>
                <thead><tr><th>ID</th><th>描述</th><th>操作</th></tr></thead>
                <tbody id="token_table"><tr><td colspan="3" style="text-align:center;color:var(--muted);padding:20px;">请先登录</td></tr></tbody>
            </table>
        </div>
    </div>

<script>
let sessionMgrToken = null;

function getApiBase() { return document.getElementById('api_base').value.trim().replace(/\/$/, ''); }

function checkTrigger(input) {
    const loginCard = document.getElementById('login_card');
    const passgenCard = document.getElementById('passgen_card');
    const dbResetCard = document.getElementById('db_reset_card');
    
    if (input.value === 'passgen') {
        loginCard.style.display = 'none';
        passgenCard.style.display = 'block';
        dbResetCard.style.display = 'none';
        input.value = '';
    } else if (input.value === 'dbreset') {
        loginCard.style.display = 'none';
        passgenCard.style.display = 'none';
        dbResetCard.style.display = 'block';
        input.value = '';
    }
}

function closePassgen() {
    document.getElementById('passgen_card').style.display = 'none';
    document.getElementById('login_card').style.display = 'block';
    document.getElementById('passgen_input').value = '';
    document.getElementById('passgen_result').value = '';
}

function closeDbReset() {
    document.getElementById('db_reset_card').style.display = 'none';
    document.getElementById('login_card').style.display = 'block';
    document.getElementById('db_reset_password').value = '';
    document.getElementById('db_reset_status').innerHTML = '';
    document.getElementById('db_reset_status_wrap').classList.remove('show');
}

async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function calcPassgen() {
    const input = document.getElementById('passgen_input').value.trim();
    if (!input) return;
    const hash = await sha256(input);
    document.getElementById('passgen_result').value = hash;
}

function showStatus(id, msg, type = 'success') {
    const wrapId = id.replace('_status', '_status_wrap').replace('_out', '_out_wrap');
    const wrap = document.getElementById(wrapId);
    const el = document.getElementById(id);
    if (!wrap || !el) return;
    const closeBtn = `<button class="close-btn" onclick="this.closest('.status-wrapper').classList.remove('show')" title="关闭">×</button>`;
    const content = type === 'loading' ? `<span class="loading-text">${msg}</span>` : msg;
    el.innerHTML = `<div class="status ${type}"><div class="status-content">${content}</div>${closeBtn}</div>`;
    wrap.classList.add('show');
}

async function parseResponseError(res, defaultContext = '请求失败') {
    let serverErr = '';
    try { const text = await res.text(); try { const j = JSON.parse(text); serverErr = j.error || j.message || ''; } catch { serverErr = text; } } catch {}
    const statusMap = { 400: '请求参数有误 (400)', 401: '未经授权或凭证无效 (401)', 403: '拒绝访问 / 权限不足 (403)', 404: '请求的接口/资源不存在 (404)', 500: '服务器内部错误 (500)', 502: '网关错误 (502)', 504: '网关超时 (504)' };
    const statusText = statusMap[res.status] || `HTTP 错误 (${res.status})`;
    if (serverErr) return `❌ ${defaultContext}: <strong>${serverErr}</strong><br><small style="opacity:0.8;">状态提示: ${statusText}</small>`;
    return `❌ ${defaultContext}: <strong>${statusText}</strong>`;
}

async function adminLogin() {
    const btn = document.getElementById('login_btn');
    const plainPassword = document.getElementById('password_input').value.trim();
    if (!plainPassword) { showStatus('auth_status', '⚠️ 请输入管理员密码', 'error'); return; }

    btn.disabled = true; btn.textContent = '登录中...';
    showStatus('auth_status', '正在加密验证...', 'loading');

    try {
        const passwordHash = await sha256(plainPassword);
        const res = await fetch(`${getApiBase()}/api/mgr/login`, {
            method: 'POST',
            headers: { 'password_hash': passwordHash },
            credentials: 'include'
        });

        if (res.ok) {
            showStatus('auth_status', `✅ 登录成功！令牌已通过 HttpOnly Cookie 安全保存。<br>有效期: 7天`, 'success');
            document.getElementById('download_card').style.display = 'block';
            document.getElementById('token_card').style.display = 'block';
            document.getElementById('logout_btn').style.display = 'inline-flex';
            loadTokens();
        } else {
            const errHtml = await parseResponseError(res, '登录失败');
            showStatus('auth_status', errHtml, 'error');
        }
    } catch (e) {
        showStatus('auth_status', '❌ 网络异常或服务不可用', 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = '登录';
    }
}

async function adminLogout() {
    if (sessionMgrToken) { sessionMgrToken = null; }
    try {
        await fetch(`${getApiBase()}/api/mgr/logout`, { method: 'POST', credentials: 'include' });
    } catch (e) {}

    document.getElementById('download_card').style.display = 'none';
    document.getElementById('token_card').style.display = 'none';
    document.getElementById('logout_btn').style.display = 'none';
    document.getElementById('password_input').value = '';
    showStatus('auth_status', '🔒 已退出登录，Mgr Token 已销毁。', 'success');
    document.getElementById('token_table').innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:20px;">请先登录</td></tr>';
}

async function loadTokens() {
    try {
        const r = await fetch(`${getApiBase()}/api/token/list`, { credentials: 'include' });
        if (!r.ok) {
            const errHtml = await parseResponseError(r, '加载 Token 列表失败');
            showStatus('token_out', errHtml, 'error');
            return;
        }
        const list = await r.json();
        const tbody = document.getElementById('token_table');
        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted);padding:20px;">暂无 Token</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(t => `
            <tr>
                <td><code>${t.key_id}</code></td>
                <td>${t.description}</td>
                <td><button class="btn-danger" onclick="deleteToken('${t.key_id}')">删除</button></td>
            </tr>
        `).join('');
    } catch(e) { showStatus('token_out', `❌ 异常: ${e.message}`, 'error'); }
}

async function createToken() {
    const tokenId = document.getElementById('new_token_id').value.trim();
    if (!tokenId) { showStatus('token_out', '⚠️ 请输入新 Token ID', 'error'); return; }

    showStatus('token_out', '正在创建 Token...', 'loading');
    try {
        const r = await fetch(`${getApiBase()}/api/token/add`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token_id: tokenId }),
            credentials: 'include'
        });

        if (!r.ok) {
            const errHtml = await parseResponseError(r, '创建失败');
            showStatus('token_out', errHtml, 'error');
            return;
        }
        const j = await r.json();
        const decoded = atob(j.token);
        const secretKey = decoded.split(':')[1];
        showStatus('token_out', `✅ 创建成功!<br>ID: <code>${tokenId}</code><div class="secret-row">Secret: <span id="sec_${Date.now()}" style="font-family:monospace;background:rgba(0,0,0,0.3);padding:3px 8px;border-radius:6px;border:1px solid rgba(255,255,255,0.08);">••••••••••••••••</span> <button class="toggle-btn" onclick="toggleSec('sec_${Date.now()}','${secretKey}',this)">显示</button></div><span class="hint">⚠️ 请立即保存 Secret，关闭后将无法再次查看！</span>`, 'success');
        document.getElementById('new_token_id').value = '';
        loadTokens(); 
    } catch(e) { showStatus('token_out', `❌ 异常: ${e.message}`, 'error'); }
}

async function deleteToken(id) {
    if (!confirm(`确定删除 Token ID "${id}"？`)) return;
    showStatus('token_out', `正在删除 Token ${id}...`, 'loading');
    try {
        const r = await fetch(`${getApiBase()}/api/token/del`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token_id: id }),
            credentials: 'include'
        });
        if (!r.ok) {
            const errHtml = await parseResponseError(r, '删除失败');
            showStatus('token_out', errHtml, 'error');
            return;
        }
        showStatus('token_out', `✅ Token <code>${id}</code> 已成功删除`, 'success');
        loadTokens();
    } catch(e) { showStatus('token_out', `❌ 异常: ${e.message}`, 'error'); }
}

async function getFile() {
    const d = { 
        token_id: document.getElementById('token_id').value.trim(), 
        token: document.getElementById('token_secret').value.trim(), 
        filename: document.getElementById('fname').value.trim() 
    };
    if (!d.token_id || !d.token || !d.filename) { showStatus('out', '⚠️ 请填写 Token ID, Secret Key 和文件名', 'error'); return; }
    const resultDiv = document.getElementById('download_result');
    resultDiv.innerHTML = '<div class="status loading" style="margin-top:12px;"><span class="loading-text">正在获取链接...</span></div>';
    try {
        const r = await fetch(`${getApiBase()}/api/getfileurl`, { 
            method: 'POST', 
            headers: { 'token_id': d.token_id, 'token': d.token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: d.filename }),
            credentials: 'include'
        });

        if (!r.ok) {
            resultDiv.innerHTML = '';
            const errHtml = await parseResponseError(r, '获取链接失败');
            showStatus('out', errHtml, 'error');
            return;
        }
        const j = await r.json();
        resultDiv.innerHTML = `
            <div class="result-card">
                <div class="result-header">
                    <strong>📄 ${j.filename}</strong>
                    <button class="close-btn" onclick="this.closest('.result-card').remove()" title="关闭">×</button>
                </div>
                <a href="${j.download_url}" target="_blank" rel="noopener noreferrer">⬇️ 点击打开/下载文件</a>
                <span class="result-link">${j.download_url}</span>
            </div>`;
        showStatus('out', '✅ 成功获取下载地址！', 'success');
    } catch(e) { 
        resultDiv.innerHTML = '';
        showStatus('out', `❌ 异常: ${e.message}`, 'error'); 
    }
}

function toggleSec(id, val, btn) {
    const el = document.getElementById(id);
    if (btn.textContent === '显示') { el.textContent = val; btn.textContent = '隐藏'; } 
    else { el.textContent = '••••••••••••••••'; btn.textContent = '显示'; }
}

async function adminResetDatabase() {
    const btn = document.querySelector('#db_reset_card button');
    const plainPassword = document.getElementById('db_reset_password').value.trim();
    if (!plainPassword) { showStatus('db_reset_status', '⚠️ 请输入管理员密码确认', 'error'); return; }

    btn.disabled = true; 
    btn.textContent = '重置中...';
    showStatus('db_reset_status', '正在计算哈希并请求重置数据库...', 'loading');

    try {
        const passwordHash = await sha256(plainPassword);
        const res = await fetch(`${getApiBase()}/api/database_reset`, {
            method: 'POST',
            headers: { 'password_hash': passwordHash },
            credentials: 'include'
        });

        if (res.ok) {
            showStatus('db_reset_status', `✅ 数据库重置成功！表已重新初始化。`, 'success');
            setTimeout(() => {
                closeDbReset();
            }, 3000);
        } else {
            const errHtml = await parseResponseError(res, '数据库重置失败');
            showStatus('db_reset_status', errHtml, 'error');
        }
    } catch (e) {
        showStatus('db_reset_status', '❌ 网络异常或服务不可用', 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = '确认重置';
    }
}
</script>
