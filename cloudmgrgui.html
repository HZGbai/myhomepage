<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HZGbai Storage Manager</title>
    <style>
        body { background: #0f172a; color: #e2e8f0; font-family: sans-serif; padding: 2rem; max-width: 600px; margin: 0 auto; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
        h2 { color: #38bdf8; margin-top: 0; font-size: 1.2rem; }
        input, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; font-size: 0.9rem; }
        th { color: #94a3b8; }
        .del-btn { background: #ef4444; color: #fff; width: auto; padding: 4px 12px; margin: 0; font-size: 0.8rem; }
        .hint { font-size: 0.75rem; color: #64748b; margin-top: 4px; }
        a { color: #38bdf8; word-break: break-all; }
        .status { padding: 8px; border-radius: 6px; margin-top: 8px; font-size: 0.85rem; }
        .success { background: rgba(74, 222, 128, 0.1); color: #4ade80; }
        .error { background: rgba(248, 113, 113, 0.1); color: #f87171; }
        code { background: #0f172a; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .gen-section { border-top: 1px solid #334155; margin-top: 1rem; padding-top: 1rem; }
    </style>
</head>
<body>
    <!-- 🔌 连接与 JWT 管理 -->
    <div class="card">
        <h2>🔌 Connection & JWT</h2>
        <input type="text" id="api_base" placeholder="API Base URL" value="https://cloud.hzgbai.dpdns.org">
        <input type="text" id="jwt_input" onpaste="setTimeout(()=>this.value=this.value.replace(/\s+/g,''),0)" placeholder="Paste or Generate JWT here">
        <button onclick="validateAndSaveJwt()">Validate & Save JWT</button>
        <div id="conn_status"></div>

        <!-- 🛠️ 内置 JWT 生成器 -->
        <div class="gen-section">
            <h2 style="font-size:1rem; color:#94a3b8;">🛠️ JWT Generator (Custom SHA256+Hex)</h2>
            <p class="hint">Enter your Dashboard JWT_SECRET to generate a valid token instantly.</p>
            <input type="text" id="gen_secret" placeholder="Dashboard JWT_SECRET">
            <button onclick="generateJwtInline()" style="background:#64748b;">Generate & Auto-Fill</button>
            <div id="gen_status"></div>
        </div>
    </div>

    <!-- 🔗 下载链接获取 -->
    <div class="card">
        <h2> Get Download Link</h2>
        <input type="text" id="key_id" placeholder="Token ID (e.g., a3f)">
        <input type="password" id="secret_key" placeholder="Secret Key (64 hex chars)">
        <input type="text" id="fname" placeholder="Filename">
        <button onclick="getFile()">Get Link</button>
        <div id="out"></div>
    </div>

    <!--  Token 管理 -->
    <div class="card">
        <h2>🔑 Token Management</h2>
        <input type="text" id="new_desc" placeholder="New Token Description">
        <button onclick="createToken()">Create Token</button>
        <div id="token_out"></div>
        <table>
            <thead><tr><th>ID</th><th>Description</th><th>Action</th></tr></thead>
            <tbody id="token_table"><tr><td colspan="3" style="text-align:center;color:#64748b;">Validate JWT to load tokens</td></tr></tbody>
        </table>
    </div>

<script>
// ==================== 🔐 纯内存会话管理 ====================
let sessionJwt = null;
window.addEventListener('beforeunload', () => { sessionJwt = null; });

function getApiBase() { return document.getElementById('api_base').value.trim().replace(/\/$/, ''); }

// ==================== 🛠️ 自定义 JWT 生成逻辑 (SHA256 + Hex) ====================
async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function generateJwtInline() {
    const secretInput = document.getElementById('gen_secret');
    const jwtInput = document.getElementById('jwt_input');
    const statusEl = document.getElementById('gen_status');
    const secret = secretInput.value.trim();

    if (!secret) {
        statusEl.innerHTML = '<div class="status error">Please enter JWT_SECRET</div>';
        return;
    }

    try {
        // ️ 严格匹配 Worker 后端的签名拼接方式: header.payload.SECRET
        const h = btoa(JSON.stringify({alg:'HS256',typ:'JWT'}));
        const p = btoa(JSON.stringify({sub:'admin',exp:Math.floor(Date.now()/1000)+3600}));
        const sig = await sha256(h + '.' + p + secret);
        const jwt = h + '.' + p + '.' + sig;

        jwtInput.value = jwt;
        statusEl.innerHTML = '<div class="status success">✅ JWT generated & auto-filled! Click "Validate & Save"</div>';
        
        // 可选：生成后自动触发验证
        // validateAndSaveJwt(); 
    } catch (e) {
        statusEl.innerHTML = '<div class="status error">Generation failed: ' + e.message + '</div>';
    }
}
// ======================================================================

async function validateAndSaveJwt() {
    const jwtInput = document.getElementById('jwt_input');
    const statusEl = document.getElementById('conn_status');
    const rawJwt = jwtInput.value.replace(/\s+/g, '').trim();
    
    if (!rawJwt) { statusEl.innerHTML = '<div class="status error">JWT cannot be empty</div>'; return; }
    
    const parts = rawJwt.split('.');
    if (parts.length !== 3) { 
        statusEl.innerHTML = `<div class="status error">Invalid format (${parts.length} segments)<br><span class="hint">Use the Generator above or check for spaces</span></div>`; 
        return; 
    }
    
    try {
        const res = await fetch(`${getApiBase()}/api/tokens/list`, { headers: { 'Authorization': 'Bearer ' + rawJwt } });
        if (res.ok || res.status === 401) {
            sessionJwt = rawJwt;
            jwtInput.type = 'password';
            statusEl.innerHTML = `<div class="status success">✅ JWT saved in memory<br><span class="hint">Status: ${res.status === 200 ? 'Valid' : 'Format OK, check permissions'}</span></div>`;
            loadTokens();
        } else {
            statusEl.innerHTML = '<div class="status error">Server rejected JWT (' + res.status + '). Check SECRET or expiration.</div>';
        }
    } catch (e) {
        statusEl.innerHTML = '<div class="status error">Connection failed: ' + e.message + '</div>';
    }
}

function requireJwt() {
    if (!sessionJwt) throw new Error('Please validate your JWT first');
    return sessionJwt;
}

function showStatus(id, msg, err=false) {
    document.getElementById(id).innerHTML = `<div class="status ${err?'error':'success'}">${msg}</div>`;
}

async function getFile() {
    const out = document.getElementById('out');
    const d = { key_id: document.getElementById('key_id').value.trim(), secret_key: document.getElementById('secret_key').value.trim(), filename: document.getElementById('fname').value.trim() };
    if (!d.key_id || !d.secret_key || !d.filename) { showStatus('out', 'Fill all fields', true); return; }
    out.innerHTML = '<div class="status">Loading...</div>';
    try {
        const r = await fetch(`${getApiBase()}/api/getfile`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d) });
        const j = await r.json();
        if (r.ok) out.innerHTML = `<div class="status success"><strong>${j.filename}</strong><br><a href="${j.download_url}" target="_blank">Download</a><br><span class="hint">${j.download_url}</span></div>`;
        else showStatus('out', j.error, true);
    } catch(e) { showStatus('out', e.message, true); }
}

async function loadTokens() {
    try {
        const r = await fetch(`${getApiBase()}/api/tokens/list`, { headers:{'Authorization':'Bearer '+requireJwt()} });
        if (!r.ok) { showStatus('token_out', (await r.json()).error, true); return; }
        const list = await r.json();
        document.getElementById('token_table').innerHTML = list.length ? list.map(t=>`<tr><td><code>${t.key_id}</code></td><td>${t.description}</td><td><button class="del-btn" onclick="deleteToken('${t.key_id}')">Delete</button></td></tr>`).join('') : '<tr><td colspan="3" style="text-align:center;color:#64748b;">No tokens</td></tr>';
    } catch(e) { showStatus('token_out', e.message, true); }
}

async function createToken() {
    const desc = document.getElementById('new_desc').value.trim();
    if (!desc) { showStatus('token_out', 'Description required', true); return; }
    try {
        const r = await fetch(`${getApiBase()}/api/token/add`, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+requireJwt()}, body:JSON.stringify({description:desc}) });
        const j = await r.json();
        if (r.ok) { showStatus('token_out', `✅ Created!<br>ID: <code>${j.key_id}</code><br>Secret: <code>${j.secret_key}</code><br><span class="hint">Save secret now!</span>`); loadTokens(); }
        else showStatus('token_out', j.error, true);
    } catch(e) { showStatus('token_out', e.message, true); }
}

async function deleteToken(id) {
    if (!confirm(`Delete "${id}"?`)) return;
    try {
        const r = await fetch(`${getApiBase()}/api/token/delete`, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+requireJwt()}, body:JSON.stringify({key_id:id}) });
        const j = await r.json();
        if (r.ok) loadTokens(); else alert(j.error);
    } catch(e) { alert(e.message); }
}
</script>
</body>
</html>
