<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry</title>
    <link rel="icon" href="https://hzgbai.dpdns.org/icon/mainicon.png" type="image/png">
    <link rel="apple-touch-icon" href="https://icon.hzgbai.dpdns.org/mainicon.png">
    <style>
        :root {
            --bg-base: #0a0f1d;
            --card-bg: rgba(30, 41, 59, 0.45);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --primary-link: #38bdf8;
            --primary-hover: #7dd3fc;
            --error-color: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 液态弥散背景渐变 */
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(239, 68, 68, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 1.5rem;
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 液态毛玻璃卡片 */
        .container {
            text-align: center;
            max-width: 540px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 24px;
            padding: 3rem 2rem;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .container:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.2);
        }

        .error-icon {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 1.5rem;
            display: inline-block;
            filter: drop-shadow(0 4px 12px rgba(239, 68, 68, 0.3));
            animation: pulse 2s infinite ease-in-out;
        }

        .main-message {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.01em;
            margin-bottom: 0.75rem;
        }

        .sub-message {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-sub);
            margin-bottom: 1rem;
        }

        .feedback-message {
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--text-sub);
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .feedback-message a {
            color: var(--primary-link);
            text-decoration: none;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            transition: all 0.25s ease;
        }

        .feedback-message a:hover {
            color: #ffffff;
            background: var(--primary-link);
            border-color: var(--primary-link);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .feedback-message a:focus-visible {
            outline: 2px solid var(--primary-link);
            outline-offset: 2px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.25rem;
                border-radius: 20px;
            }
            .error-icon {
                font-size: 3.2rem;
            }
            .main-message {
                font-size: 1.25rem;
            }
            .sub-message,
            .feedback-message {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="error-icon" aria-hidden="true">⚠️</span>
        <div class="main-message">Sorry, this page is temporarily unavailable.</div>
        <div class="sub-message">Waiting for a while may resolve the issue.</div>
        <div class="feedback-message">
            If you would like to send us feedback, please email us at
            <a href="mailto:admin@hzgbai.dpdns.org">admin@hzgbai.dpdns.org</a>. Thank you.
        </div>
    </div>
</body>
</html>
